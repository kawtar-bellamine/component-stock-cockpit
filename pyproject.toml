[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "component-stock-cockpit"
version = "1.0.0"
description = "Classify slow-moving parts, forecast them honestly, set stock levels that hold, and propose orders"
authors = [{ name = "Abderrahmane BOULAMI" }]
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["numpy>=1.26", "pandas>=2.1", "pyreadr>=0.5", "duckdb>=1.1", "matplotlib>=3.8", "streamlit>=1.51",
                "altair>=5.0"]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.setuptools]
packages = ["csc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
